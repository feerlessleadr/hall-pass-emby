name: CI

# Builds the plugin and runs the unit tests on every push to main and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the plugin
        # --locked-mode: build only with the exact package versions and hashes recorded in packages.lock.json
        run: |
          dotnet restore src/HallPass --locked-mode
          dotnet build src/HallPass -c Release --no-restore

      - name: Run the unit tests
        run: dotnet test tests/HallPass.Tests
